name: Build Linux packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      EXTENSION_UPDATE_URL: ${{ vars.EXTENSION_UPDATE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install test and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb rpm

      - name: Electron smoke test (Xvfb)
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' npm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: '1'

      - name: Build AppImage, deb, and rpm
        run: npm run dist

      - name: Validate browser extension
        run: npm run extension:validate

      - name: Generate checksums
        run: |
          cd release
          sha256sum TeamWork-*.AppImage TeamWork-*.deb TeamWork-*.rpm TeamWork-Browser-Extension-*.zip > SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teamwork-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/TeamWork-*.AppImage
            release/TeamWork-*.deb
            release/TeamWork-*.rpm
            release/TeamWork-Browser-Extension-*.zip
            release/SHA256SUMS
