version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - electron
          - electron-vite
          - electron-builder
      build-tools:
        patterns:
          - vite
          - vitest
          - typescript
          - esbuild
          - '@vitejs/plugin-react'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
