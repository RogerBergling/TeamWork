name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      EXTENSION_UPDATE_URL: ${{ vars.EXTENSION_UPDATE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify tag matches package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          test "$VERSION" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Install test and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb rpm

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Electron smoke test (Xvfb)
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' npm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: '1'

      - name: Build packages and extension
        run: npm run dist

      - name: Generate checksums
        run: |
          cd release
          sha256sum TeamWork-*.AppImage TeamWork-*.deb TeamWork-*.rpm TeamWork-Browser-Extension-*.zip > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: TeamWork ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/TeamWork-*.AppImage
            release/TeamWork-*.deb
            release/TeamWork-*.rpm
            release/TeamWork-Browser-Extension-*.zip
            release/SHA256SUMS
